{% extends "base.html" %}

{% block title %}Calendar - Community Calendar{% endblock %}

{% block extra_head %}
<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css"
      rel="stylesheet"
      nonce="{{ csp_nonce() }}">
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="fas fa-calendar"></i> Community Calendar
        </h2>

        <div class="card shadow">
            <div class="card-body">
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</div>

<!-- Event Detail Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalTitle">Event Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="eventModalContent">
                    <!-- Content loaded dynamically -->
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <a id="viewEventLink" href="#" class="btn btn-primary">
                    View Full Event
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"
        nonce="{{ csp_nonce() }}"></script>

<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var modal = new bootstrap.Modal(document.getElementById('eventModal'));

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
        },
        events: '/api/events',
        eventClick: function(info) {
            info.jsEvent.preventDefault();

            var eventId = info.event.id;

            // Set modal title
            document.getElementById('eventModalTitle').textContent = info.event.title;

            // Set view event link
            document.getElementById('viewEventLink').href = '/event/' + eventId;

            // Show modal
            modal.show();

            // Load event details
            fetch('/api/event/' + eventId)
                .then(response => response.json())
                .then(data => {
                    var event = data.event;
                    var comments = data.comments;

                    var html = '';

                    // Author info
                    html += '<div class="d-flex align-items-center mb-3">';
                    html += '<img src="' + event.author.profile_image_url + '" ';
                    html += 'class="rounded-circle me-3" width="50" height="50" ';
                    html += 'style="object-fit: cover;">';
                    html += '<div>';
                    html += '<h6 class="mb-0">' + event.author.display_name + '</h6>';
                    html += '<small class="text-muted">Posted on ' + formatDate(event.created_at) + '</small>';
                    html += '</div></div>';

                    // Event details
                    if (event.description) {
                        html += '<p class="lead">' + event.description + '</p>';
                    }

                    html += '<hr>';

                    html += '<p class="mb-2">';
                    html += '<i class="fas fa-calendar text-primary"></i> ';
                    html += '<strong>Date:</strong> ' + formatEventDate(event.event_date, event.event_time);
                    html += '</p>';

                    if (event.location) {
                        html += '<p class="mb-2">';
                        html += '<i class="fas fa-map-marker-alt text-danger"></i> ';
                        html += '<strong>Location:</strong> ' + event.location;
                        html += '</p>';
                    }

                    // Comments section
                    html += '<hr>';
                    html += '<h6><i class="fas fa-comments"></i> Comments (' + comments.length + ')</h6>';

                    if (comments.length > 0) {
                        html += '<div class="mt-3">';
                        comments.forEach(function(comment) {
                            html += '<div class="d-flex mb-3 pb-3 border-bottom">';
                            html += '<img src="' + comment.author.profile_image_url + '" ';
                            html += 'class="rounded-circle me-3" width="40" height="40" ';
                            html += 'style="object-fit: cover;">';
                            html += '<div>';
                            html += '<h6 class="mb-1">' + comment.author.display_name + ' ';
                            html += '<small class="text-muted">' + formatDate(comment.created_at) + '</small>';
                            html += '</h6>';
                            html += '<p class="mb-0">' + comment.content + '</p>';
                            html += '</div></div>';
                        });
                        html += '</div>';
                    } else {
                        html += '<p class="text-muted text-center mt-3">';
                        html += '<i class="fas fa-comment-slash"></i> No comments yet.';
                        html += '</p>';
                    }

                    document.getElementById('eventModalContent').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading event details:', error);
                    document.getElementById('eventModalContent').innerHTML =
                        '<div class="alert alert-danger">Error loading event details.</div>';
                });
        }
    });

    calendar.render();

    // Helper functions
    function formatDate(dateString) {
        var date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function formatEventDate(dateString, timeString) {
        var date = new Date(dateString);
        var formatted = date.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        if (timeString) {
            formatted += ' at ' + timeString;
        }

        return formatted;
    }
});
</script>
{% endblock %}
