# Configuration for a Flask web application on Google App Engine
# https://cloud.google.com/appengine/docs/standard/python3/config/appref

runtime: python311

instance_class: F2

handlers:
  # Static file handlers for better performance
  - url: /static/css
    static_dir: static/css
    secure: always
    http_headers:
      Strict-Transport-Security: "max-age=2592000; includeSubdomains"
      X-Content-Type-Options: "nosniff"

  - url: /static/js
    static_dir: static/js
    secure: always
    http_headers:
      Strict-Transport-Security: "max-age=2592000; includeSubdomains"
      X-Content-Type-Options: "nosniff"

  - url: /static/img
    static_dir: static/img
    secure: always
    http_headers:
      Strict-Transport-Security: "max-age=2592000; includeSubdomains"
      X-Content-Type-Options: "nosniff"

  - url: /static/uploads
    static_dir: static/uploads
    secure: always
    http_headers:
      Strict-Transport-Security: "max-age=2592000; includeSubdomains"
      X-Content-Type-Options: "nosniff"

  # All other requests handled by Flask app
  - url: /.*
    script: auto
    secure: always

env_variables:
  FLASK_SETTINGS_FILENAME: "settings.py"

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 50
